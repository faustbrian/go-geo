name: PostGIS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgis/postgis:16-3.5
          - postgis/postgis:18-3.6
    runs-on: ubuntu-latest
    services:
      postgis:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Live codec, SQL, and numerical differential tests
        env:
          POSTGIS_DSN: postgres://postgres:postgres@localhost:5432/geo?sslmode=disable
        run: go test ./postgis -run TestPostGISIntegration -count=1 -v
